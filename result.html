<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            width: 500px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .positive {
            color: green;
            font-weight: bold;
        }

        .negative {
            color: red;
            font-weight: bold;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: #5a67d8;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>📈 Sentiment Analysis Results</h2>

        <div class="stats">
            <div class="positive">
                Positive: {{ positive }}
            </div>
            <div class="negative">
                Negative: {{ negative }}
            </div>
        </div>

        <img src="{{ url_for('static', filename=chart) }}" width="400">

        <br>
        <a href="/">Analyze Another File</a>
    </div>
</body>
</html>
